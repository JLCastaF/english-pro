name: English Pro QA Shield
on: [push]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación
        run: npm run build

      - name: Iniciar servidor y correr Cypress
        run: |
          npx vite preview --host 0.0.0.0 --port 5173 &
          npx wait-on http://127.0.0.1:5173 --timeout 60000
          npx cypress run --spec cypress/e2e/Demo.cy.js
        env:
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PW: ${{ secrets.TEST_USER_PW }}
          CYPRESS_TEST_USER_EMAIL_NOT_ADMIN: ${{ secrets.TEST_USER_EMAIL_NOT_ADMIN }}
          CYPRESS_TEST_USER_PW_NOT_ADMIN: ${{ secrets.TEST_USER_PW_NOT_ADMIN }}