name: English Pro QA Shield
on: [push] # Se activa cada vez que haces push a Git

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Correr Demo E2E (Modo Invisible)
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run dev
          wait-on: 'http://localhost:5173'
          # Apuntando al archivo real de la demo:
          spec: cypress/e2e/Demo.cy.js
        env:
          # Credenciales del Administrador
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PW: ${{ secrets.TEST_USER_PW }}
          # Credenciales del Usuario Normal (No Admin)
          CYPRESS_TEST_USER_EMAIL_NOT_ADMIN: ${{ secrets.TEST_USER_EMAIL_NOT_ADMIN }}
          CYPRESS_TEST_USER_PW_NOT_ADMIN: ${{ secrets.TEST_USER_PW_NOT_ADMIN }}