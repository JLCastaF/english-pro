name: English Pro QA Shield
on: [push] # Se activa cada vez que haces push a Git

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Correr Smoke Test (Modo Invisible)
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run dev
          wait-on: 'http://localhost:5173'
          # Filtro de seguridad:
          spec: cypress/e2e/smoke_test.cy.js
        env:
          # Aquí pondremos las variables de entorno que guardamos antes
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          CYPRESS_TEST_USER_PW: ${{ secrets.TEST_USER_PW }}